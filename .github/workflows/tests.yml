name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Qualified replay kernel; native-path counterexamples remain in recovery-runtime.
  OPENBLAS_CORETYPE: "Haswell"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  locked-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: environment/python-version
          cache: pip
          cache-dependency-path: environment/core.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Record source and create isolated environment
        run: |
          git rev-parse HEAD
          sha256sum environment/core.lock
          python -m venv .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Install locked core dependencies
        run: python tools/ci/install_locked.py --profile core
      - name: Verify actual replay kernel
        run: python -m tools.ci.check_replay_kernel
      - name: Install Eigen3
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
      - name: Check pinned drand verifier
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check tools/verify_drand_beacon.mjs
      - name: Build and test C++ core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - run: python -m pytest
      - name: Diagnose exact recovery replay after failure
        if: failure()
        run: python -m tools.ci.diagnose_recovery_replay
      - name: Probe recovery replay without NumPy AVX512
        if: failure()
        run: env NPY_DISABLE_CPU_FEATURES=AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_KNL,AVX512_KNM python -m tools.ci.diagnose_recovery_replay
      - run: python -m ruff check src tests tools
      - name: Run documented smoke path
        run: franka-smoke

  floating-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install current compatible dependencies
        run: |
          git rev-parse HEAD
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip freeze
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual replay kernel
        run: python -m tools.ci.check_replay_kernel
      - name: Build C++ probes and run compatibility suite
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python -m pytest
          franka-smoke
      - name: Diagnose exact recovery replay after failure
        if: failure()
        run: python -m tools.ci.diagnose_recovery_replay
      - name: Probe recovery replay without NumPy AVX512
        if: failure()
        run: env NPY_DISABLE_CPU_FEATURES=AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_KNL,AVX512_KNM python -m tools.ci.diagnose_recovery_replay

  learning-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: environment/python-version
          cache: pip
          cache-dependency-path: |
            environment/core.lock
            environment/learning-cpu.lock
      - name: Record source and create isolated environment
        run: |
          git rev-parse HEAD
          sha256sum environment/learning-cpu.lock
          python -m venv .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Install locked CPU learning dependencies
        run: python tools/ci/install_locked.py --profile learning-cpu
      - name: Verify actual replay kernel
        run: python -m tools.ci.check_replay_kernel
      - name: Require CPU Torch and all learning tests
        run: |
          python -c 'import torch; assert torch.version.cuda is None; print("CPU Torch:", torch.__version__)'
          mapfile -t learning_tests < environment/learning-tests.txt
          python -m pytest "${learning_tests[@]}" --junitxml=learning-junit.xml
          python tools/ci/check_learning_junit.py learning-junit.xml
      - name: Preserve learning test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-tests-${{ github.sha }}
          path: learning-junit.xml
          if-no-files-found: error
          retention-days: 14
