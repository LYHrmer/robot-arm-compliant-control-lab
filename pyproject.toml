[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliant-control-lab"
version = "0.5.1"
description = "Reproducible MuJoCo lab for impedance, admittance, and hybrid force-position control."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "matplotlib>=3.7,<4",
  "mujoco>=3.1,<4",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff>=0.6,<1"]

[project.scripts]
compliant-control-lab = "compliant_control_lab.experiments:main"
franka-control-lab = "compliant_control_lab.franka_experiments:main"
franka-stress-lab = "compliant_control_lab.franka_stress:main"
franka-learning-lab = "compliant_control_lab.franka_learning:main"
franka-safety-learning-lab = "compliant_control_lab.franka_safety_learning:main"
franka-post-reveal-analysis = "compliant_control_lab.post_reveal_analysis:main"
franka-published-results-audit = "compliant_control_lab.published_results_audit:main"
franka-contact-event-analysis = "compliant_control_lab.contact_event_analysis:main"
franka-reference-ablation = "compliant_control_lab.reference_ablation:main"
franka-smoke = "compliant_control_lab.smoke:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compliant_control_lab = [
  "assets/*.xml",
  "assets/**/*.xml",
  "assets/**/*.obj",
  "assets/**/*.stl",
  "assets/**/*.png",
  "assets/**/LICENSE",
  "assets/**/README.md",
  "assets/**/UPSTREAM.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
